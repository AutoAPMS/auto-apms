name: Rolling

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

jobs:
  build_and_test_main:
    uses: ./.github/workflows/build-and-test-reusable.yaml
    with:
      ros_distribution: rolling
      docker_image: ubuntu:resolute

  build_and_test_testing:
    uses: ./.github/workflows/build-and-test-reusable.yaml
    with:
      ros_distribution: rolling
      docker_image: ubuntu:resolute
      use_ros2_testing: true
      node_reference_manifests: include_native auto_apms_behavior_tree::behavior_tree_nodes

  update_node_reference:
    needs: build_and_test_testing # Only run this job after the build_and_test_testing job has completed successfully.
    if: github.event_name == 'push' # Don't run this job on pull requests, only on pushes.
    uses: ./.github/workflows/update-node-reference-reusable.yaml
    secrets: inherit
